# Ubuntu Security Gateway Lab - network hardening profile
#
# This host is intentionally a router/gateway. IPv4 forwarding therefore
# remains enabled. Review these values before applying them on another host.

# Gateway routing requirement.
net.ipv4.ip_forward = 1

# Loose reverse-path filtering is used because the lab has multiple bridges,
# virtual networks and asymmetric-looking paths (Docker/libvirt/lab networks).
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

# Do not learn routes from ICMP Redirect messages.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0

# Do not emit ICMP Redirect messages. The wildcard also covers concrete
# interfaces managed by systemd-sysctl.
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.*.send_redirects = 0

# Reject IPv4 source routing.
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# Log suspicious/impossible source addresses for troubleshooting and review.
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Keep SYN cookies enabled.
net.ipv4.tcp_syncookies = 1
