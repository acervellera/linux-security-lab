<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#15243b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <text x="70" y="82" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="700">Phase 11 - Gateway Hardening</text>
  <text x="70" y="122" fill="#93c5fd" font-family="Inter,Arial,sans-serif" font-size="22">Verified on the Ubuntu security gateway - 31 Jul 2026</text>

  <g filter="url(#shadow)">
    <rect x="70" y="170" width="330" height="150" rx="20" fill="#111c2e" stroke="#334155"/>
    <text x="100" y="212" fill="#60a5fa" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">KERNEL / NETWORK</text>
    <text x="100" y="250" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="19">IPv4 forwarding: ON</text>
    <text x="100" y="280" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="19">ICMP redirects: OFF</text>
    <text x="100" y="310" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="19">SYN cookies: ON</text>

    <rect x="435" y="170" width="330" height="150" rx="20" fill="#111c2e" stroke="#334155"/>
    <text x="465" y="212" fill="#34d399" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">SERVICES</text>
    <text x="465" y="250" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="19">Failed units: 0</text>
    <text x="465" y="280" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="19">SSH listener: none</text>
    <text x="465" y="310" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="19">Avahi / mDNS: disabled</text>

    <rect x="800" y="170" width="330" height="150" rx="20" fill="#111c2e" stroke="#334155"/>
    <text x="830" y="212" fill="#fbbf24" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">ACCESS / UPDATE</text>
    <text x="830" y="250" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="19">Docker socket: restricted</text>
    <text x="830" y="280" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="19">World-writable files: 0</text>
    <text x="830" y="310" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="19">Auto security updates: ON</text>
  </g>

  <g>
    <rect x="70" y="365" width="1060" height="175" rx="22" fill="#0f1a2a" stroke="#334155"/>
    <text x="100" y="410" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">Hardening principle</text>
    <text x="100" y="450" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="21">Reduce attack surface without breaking the gateway role.</text>
    <text x="100" y="486" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="21">Keep routing, nftables, Suricata, Zeek, Python analytics and Docker observability working.</text>
    <text x="100" y="522" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="21">Every change is validated against connectivity, services, permissions and persistence.</text>
  </g>

  <text x="70" y="590" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="18">Ubuntu Security Gateway Lab - public, privacy-reviewed summary</text>
</svg>
